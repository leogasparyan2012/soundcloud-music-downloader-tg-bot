name: Stop and Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  stop-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Suspend Render Service
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/suspend" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

      - name: 2. Wait for process to stop
        run: sleep 15

      - name: 3. Resume Render Service
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/resume" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

      - name: 4. Trigger New Deploy
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '"{\"clearCache\": \"do_not_clear\", \"commitId\": \"${{ github.sha }}\"}''
